<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stay Voca</title>
  <link rel="canonical" href="https://millionaireuncle.github.io/stayvoca/en/" />
  <link rel="alternate" hreflang="ko" href="https://millionaireuncle.github.io/stayvoca/ko/" />
  <link rel="alternate" hreflang="en" href="https://millionaireuncle.github.io/stayvoca/en/" />
  <link rel="alternate" hreflang="ja" href="https://millionaireuncle.github.io/stayvoca/ja/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://millionaireuncle.github.io/stayvoca/zh-Hant/" />
  <script>
    // 브라우저 언어로 보낸다. 앱과 같은 규칙: 번체 중국어(Hant, 대만·홍콩·마카오)는 zh-Hant, 간체 중국어와 그 밖의 언어는 영어
    (function () {
      var pick = 'en';
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < langs.length; i++) {
        var l = langs[i].toLowerCase();
        if (l.indexOf('ko') === 0) { pick = 'ko'; break; }
        if (l.indexOf('ja') === 0) { pick = 'ja'; break; }
        if (l.indexOf('zh') === 0) { pick = /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'en'; break; }
        if (l.indexOf('en') === 0) break;
      }
      location.replace(pick + '/' + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=en/" /></noscript>
</head>
<body>
<p><a href="ko/">한국어</a> · <a href="en/">English</a> · <a href="ja/">日本語</a> · <a href="zh-Hant/">繁體中文</a></p>
</body>
</html>
